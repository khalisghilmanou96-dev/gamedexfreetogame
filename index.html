<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GameDex</title><style>*{box-sizing:border-box}body{margin:0;background:#090913;color:#f8f7ff;font-family:system-ui}.wrap{width:min(1200px,94%);margin:auto;padding:30px 0}.hero{padding:38px;border:1px solid #30305a;border-radius:28px;background:#151528}.hero h1{font-size:clamp(40px,6vw,68px);margin:8px 0;color:#56e6ff}.controls{display:grid;grid-template-columns:1fr 180px 180px;gap:10px;margin:20px 0}.controls>*{padding:14px;border-radius:14px;border:1px solid #30305a;background:#121222;color:white}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#151528;border:1px solid #30305a;border-radius:18px;overflow:hidden;cursor:pointer}.card img{width:100%;aspect-ratio:16/9;object-fit:cover}.body{padding:13px}.body p,.meta,footer{color:#a5a3c0;font-size:11px}.tag{color:#56e6ff;font-size:9px}.modal{display:none;position:fixed;inset:0;background:#05050bdd;align-items:center;justify-content:center;padding:20px}.modal.open{display:flex}.sheet{width:min(800px,100%);max-height:90vh;overflow:auto;background:#151528;padding:20px;border-radius:22px}.sheet img{width:100%;border-radius:14px}.sheet a,.sheet button{padding:11px 14px;border:0;border-radius:12px;background:#56e6ff;color:#081016;font-weight:900;text-decoration:none}.empty{grid-column:1/-1;padding:50px;text-align:center;color:#a5a3c0}
.ad-zone{width:100%;display:flex;justify-content:center;align-items:center;margin:24px 0;overflow:hidden}.ad-desktop{display:block}.ad-mobile{display:none}.ad-square{min-height:250px}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:550px){.grid,.controls{grid-template-columns:1fr}.ad-desktop{display:none}.ad-mobile{display:block}}</style></head><body><div class="wrap"><div class="hero"><small>🎮 FREETOGAME API • SANS CLÉ</small><h1>GameDex</h1><p>Découvre des centaines de jeux free-to-play avec images, genres, plateformes et fiches détaillées.</p></div>

<footer>Données : <a style="color:#56e6ff" href="https://www.freetogame.com/" target="_blank">FreeToGame.com</a></footer></div><div class="modal" id="modal"><div class="sheet" id="sheet"></div></div><script>const A='https://www.freetogame.com/api',q=document.querySelector('#q'),pl=document.querySelector('#platform'),ge=document.querySelector('#genre'),grid=document.querySelector('#grid'),st=document.querySelector('#status'),modal=document.querySelector('#modal'),sheet=document.querySelector('#sheet');let games=[];const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function get(u){let r=await fetch(u);if(!r.ok)throw Error(r.status);return r.json()}function render(){let t=q.value.toLowerCase(),p=pl.value,g=ge.value,a=games.filter(x=>(!t||(x.title+' '+x.short_description).toLowerCase().includes(t))&&(!p||x.platform===p)&&(!g||x.genre===g));st.textContent=a.length+' jeux';grid.innerHTML=a.map(x=>`<article class="card" data-id="${x.id}"><img src="${e(x.thumbnail)}" loading="lazy"><div class="body"><span class="tag">${e(x.genre)}</span><h3>${e(x.title)}</h3><p>${e(x.short_description)}</p></div></article>`).join('')||'<div class="empty">Aucun jeu trouvé.</div>';document.querySelectorAll('.card').forEach(c=>c.onclick=()=>detail(c.dataset.id))}async function detail(id){modal.classList.add('open');sheet.innerHTML='Chargement…';try{let x=await get(A+'/game?id='+id);sheet.innerHTML=`<img src="${e(x.thumbnail)}"><h2>${e(x.title)}</h2><p>${e(x.description)}</p><p><b>Genre :</b> ${e(x.genre)}<br><b>Plateforme :</b> ${e(x.platform)}<br><b>Développeur :</b> ${e(x.developer)}<br><b>Éditeur :</b> ${e(x.publisher)}<br><b>Sortie :</b> ${e(x.release_date)}</p><a href="${e(x.game_url)}" target="_blank">Voir le jeu ↗</a> <button onclick="modal.classList.remove('open')">Fermer</button>`}catch(_){sheet.innerHTML='<h2>Fiche indisponible</h2>'}}modal.onclick=x=>{if(x.target===modal)modal.classList.remove('open')};[q,pl,ge].forEach(x=>x.addEventListener(x===q?'input':'change',render));(async()=>{try{games=await get(A+'/games');[...new Set(games.map(x=>x.genre))].sort().forEach(g=>ge.insertAdjacentHTML('beforeend',`<option>${e(g)}</option>`));render()}catch(_){st.textContent='API inaccessible';grid.innerHTML='<div class="empty">FreeToGame peut bloquer les appels CORS directs depuis certains navigateurs.</div>'}})();</script></body></html>
